[[exceptions]]
check = "DB002-unsafe_sql_construction"
path = "src/mcp_metsuke_crunchtools/database.py"
justification = "The f-string in _init_schema's ALTER TABLE statement interpolates table, column and ddl, but all three values come exclusively from the module-level constant tuple _MIGRATIONS (defined earlier in this same file, nine hardcoded entries) -- never from user input, request parameters, or any external source. SQLite's `?` parameter binding covers values, not identifiers (table/column names cannot be parameterized in SQL at all, by any driver), so this is the only way to express a conditional ALTER TABLE ... ADD COLUMN. Not a SQL injection vector: there is no path from external input to this string. Previously triaged; not exploitable."
classification = "by_design"

[[exceptions]]
check = "EV002-manifest_lint_suppression"
path = "pyproject.toml"
justification = "Each remaining global ruff ignore was verified against this codebase with the project's own pinned toolchain (`uv run ruff check --select <RULE>`, ignore list temporarily cleared for an unmasked read) before being kept: TRY003 (database.py, models.py -- SQLite/validation error messages), PLR0913/PLR0917 (4 src/ files -- database.py, server.py, tools/definitions.py, tools/outputs.py -- MCP tool signatures mirror the wire API and genuinely take many named/positional parameters), PLW0603 (config.py + database.py, module-level lazy singletons), PLC0415 (4 sites in __init__.py -- deliberate lazy imports so the CLI only pulls in the scheduler, database, and server modules when the corresponding code path actually runs), TID252 (tools/definitions.py, tools/outputs.py, this package's own internal relative imports). Two previously-global entries with zero hits anywhere (PIE790, S105) were dropped, and one fixable outright (RUF022: one unsorted `__all__` in tools/__init__.py) was resolved with `ruff check --fix` instead of kept ignored. S101 (assert), PLR2004 (magic numbers in test assertions -- this repo has zero src/ hits for it, unlike some sibling repos), and ARG002 (unused mock-callback arguments) were moved from the global ignore into `[tool.ruff.lint.per-file-ignores]` for tests/* -- all three fire only in tests/, never in src/."
classification = "by_design"
