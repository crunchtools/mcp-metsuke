# Canonical Dependabot config for crunchtools Python projects using uv.
# Drop in as .github/dependabot.yml. See constitution.md Section XV.
#
# Covers both ecosystems that go stale silently if left unpinned:
#   - uv:            uv.lock (must be committed, never gitignored)
#   - github-actions: `uses: some-action@vX.Y.Z` pins in .github/workflows/

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # pyproject pins fastmcp<4 / mcp<2 (McpError rename crash-looped 1.2.0);
      # Dependabot bumped uv.lock past those pins anyway (#19).
      - dependency-name: "fastmcp"
        versions: [">=4"]
      - dependency-name: "mcp"
        versions: [">=2"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "crunchtools/constitution*"
